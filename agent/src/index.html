<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CClub Lock Screen</title>
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="lock-screen-container">
    <!-- Pulsing ambient glow circles in the background -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="kiosk-card">
      <div class="lock-icon-container">
        <!-- Lock Icon SVG with pulsing glow -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lock-svg">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span class="pulse-ring"></span>
      </div>

      <h1 class="brand-title">CClub</h1>
      <div class="divider"></div>
      
      <h2 class="status-heading">KOMPYUTER QULFLANGAN</h2>
      <p class="status-description">Bu kompyuter hozirda bo'sh turibdi.</p>
      
      <div class="instruction-box">
        <p class="instruction-text">Sessiyani boshlash uchun administratorga murojaat qiling va to'lovni amalga oshiring.</p>
      </div>

      <div class="footer-info">
        <span>CClub Kiosk Agent v1.0.0</span>
      </div>
    </div>
  </div>
</body>
</html>
